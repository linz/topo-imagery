[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "topo-imagery-pointcloud"
version = "0.1.0"
description = "Command line tools for point cloud (PDAL) topo-imagery processing"
requires-python = "~=3.12.3"
dependencies = [
    "linz-logger",
    "topo-imagery-common",
    "topo-imagery-pdal",
]

[project.scripts]
fix-laz-header = "topo_imagery_pointcloud.fix_laz_header:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-dependency",
    "pytest-subtests",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]

[tool.uv]
package = true

[tool.uv.sources]
topo-imagery-common = { workspace = true }
topo-imagery-pdal = { workspace = true }

name: Containers (pull request)

# Publishes a pr-<number> image when the `container` label is applied.
on:
  pull_request:
    types: labeled

jobs:
  containers:
    if: ${{ github.event.label.name == 'container' }}
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    secrets: inherit
    with:
      publish: pr
